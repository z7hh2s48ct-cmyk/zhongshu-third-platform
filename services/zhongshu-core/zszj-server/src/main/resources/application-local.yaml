server:
  port: 48080

--- #################### 数据库相关配置 ####################
spring:
  autoconfigure:
    # noinspection SpringBootApplicationYaml
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration # 默认 local 环境，不开启 Quartz 的自动配置
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration # 禁用 AI 模块的 Qdrant，手动创建
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration # 禁用 AI 模块的 Milvus，手动创建
  # 数据源配置项
  datasource:
    druid: # Druid 【监控】相关的全局配置
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: false # ZS-ENG-005：Druid 控制台默认关闭（原为匿名开放且未设账密）
        allow: # 设置白名单，不填则允许所有访问
        url-pattern: /druid/*
        login-username: # 控制台管理用户名和密码
        login-password:
      filter:
        stat:
          enabled: true
          log-slow-sql: true # 慢 SQL 记录
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic: # 多数据源配置（ZS-DB-001.A / D-08：仅 PostgreSQL 单主库，模拟从库已移除）
      druid: # Druid 【连接池】相关的全局配置
        initial-size: 5 # 初始连接数
        min-idle: 10 # 最小连接池数量
        max-active: 20 # 最大连接池数量
        max-wait: 60000 # 配置获取连接等待超时的时间，单位：毫秒（1 分钟）
        time-between-eviction-runs-millis: 60000 # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位：毫秒（1 分钟）
        min-evictable-idle-time-millis: 600000 # 配置一个连接在池中最小生存的时间，单位：毫秒（10 分钟）
        max-evictable-idle-time-millis: 1800000 # 配置一个连接在池中最大生存的时间，单位：毫秒（30 分钟）
        validation-query: ${ZSZJ_DATASOURCE_VALIDATION_QUERY:SELECT 1} # 连接有效性检查（PG 方言：SELECT 1）
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: false # ZS-DB-001.B：PG 下开启 Druid PSCache 会导致 statement 已关闭错误，实测关闭
        max-pool-prepared-statement-per-connection-size: 20 # 每个连接缓存的 PreparedStatement 数量
      primary: master
      datasource:
        master:
          url: ${ZSZJ_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/ruoyi-vue-pro} # 目标库名以 ZS-DB-002 环境核验为准
          username: ${ZSZJ_DATASOURCE_USERNAME:postgres}
          password: "${ZSZJ_DATASOURCE_PASSWORD:}" # 按环境注入
  # Redis 配置。Redisson 默认的配置足够使用，一般不需要进行调优
  data:
    redis:
      host: 127.0.0.1 # 地址
      port: 6379 # 端口
      database: 0 # 数据库索引
#      password: 按环境注入

--- #################### 定时任务相关配置 ####################

# Quartz 配置项，对应 QuartzProperties 配置类
spring:
  quartz:
    auto-startup: ${ZSZJ_APPLICATION_LOCAL_QUARTZ_AUTO_STARTUP:false} # ZS-ENG-006：本地默认不启动调度器；与 exclude QuartzAutoConfiguration 保持一致，确需调试经环境变量显式开启
    scheduler-name: schedulerName # Scheduler 名字。默认为 schedulerName
    job-store-type: jdbc # Job 存储器类型。默认为 memory 表示内存，可选 jdbc 使用数据库。
    wait-for-jobs-to-complete-on-shutdown: true # 应用关闭时，是否等待定时任务执行完成。默认为 false ，建议设置为 true
    properties: # 添加 Quartz Scheduler 附加属性，更多可以看 http://www.quartz-scheduler.org/documentation/2.4.0-SNAPSHOT/configuration.html 文档
      org:
        quartz:
          # Scheduler 相关配置
          scheduler:
            instanceName: schedulerName
            instanceId: AUTO # 自动生成 instance ID
          # JobStore 相关配置
          jobStore:
            # JobStore 实现类。可见博客：https://blog.csdn.net/weixin_42458219/article/details/122247162
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            isClustered: true # 是集群模式
            clusterCheckinInterval: 15000 # 集群检查频率，单位：毫秒。默认为 15000，即 15 秒
            misfireThreshold: 60000 # misfire 阀值，单位：毫秒。
          # 线程池相关配置
          threadPool:
            threadCount: 25 # 线程池大小。默认为 10 。
            threadPriority: 5 # 线程优先级
            class: org.quartz.simpl.SimpleThreadPool # 线程池类型
    jdbc: # 使用 JDBC 的 JobStore 的时候，JDBC 的配置
      initialize-schema: NEVER # 是否自动使用 SQL 初始化 Quartz 表结构。这里设置成 never ，我们手动创建表结构。

--- #################### 消息队列相关 ####################

# rocketmq 配置项，对应 RocketMQProperties 配置类
rocketmq:
  name-server: 127.0.0.1:9876 # RocketMQ Namesrv

spring:
  # RabbitMQ 配置项，对应 RabbitProperties 配置类
  rabbitmq:
    host: 127.0.0.1 # RabbitMQ 服务的地址
    port: 5672 # RabbitMQ 服务的端口
    username: rabbit # RabbitMQ 服务的账号
    password: "${ZSZJ_APPLICATION_LOCAL_SPRING_RABBITMQ_PASSWORD:}" # source demo secret removed; configure explicitly
  # Kafka 配置项，对应 KafkaProperties 配置类
  kafka:
    bootstrap-servers: 127.0.0.1:9092 # 指定 Kafka Broker 地址，可以设置多个，以逗号分隔

--- #################### 服务保障相关配置 ####################

# Lock4j 配置项
lock4j:
  acquire-timeout: 3000 # 获取分布式锁超时时间，默认为 3000 毫秒
  expire: 30000 # 分布式锁的超时时间，默认为 30000 毫秒

--- #################### 监控相关配置 ####################

# Actuator 监控端点的配置项
management:
  endpoints:
    web:
      base-path: /actuator # Actuator 提供的 API 接口的根目录。默认为 /actuator
      exposure:
        include: health,info,metrics # ZS-ENG-005：本地仅开放诊断端点，health 匿名、其余需认证

# Spring Boot Admin 配置项
spring:
  boot:
    admin:
      # Spring Boot Admin Client 客户端的相关配置
      client:
        url: http://127.0.0.1:${server.port}/${spring.boot.admin.context-path} # 设置 Spring Boot Admin Server 地址
        instance:
          service-host-type: IP # 注册实例时，优先使用 IP [IP, HOST_NAME, CANONICAL_HOST_NAME]
        username: admin
        password: "${ZSZJ_APPLICATION_LOCAL_SPRING_BOOT_ADMIN_CLIENT_PASSWORD:}" # source demo secret removed; configure explicitly
      # Spring Boot Admin Server 服务端的相关配置
      context-path: /admin # 配置 Spring
      # 允许嵌入 iframe 的域名（支持通配符），实际部署时，可以改为 "'self' [你的公网域名]"
      frame-ancestors: "'self' localhost localhost:48080 127.0.0.1 127.0.0.1:48080"

# 日志文件配置
logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log # 日志文件名，全路径
  level:
    # 配置自己写的 MyBatis Mapper 打印日志
    cn.zszj.module.infra.dal.mysql: debug
    cn.zszj.module.infra.dal.mysql.logger.ApiErrorLogMapper: INFO # 配置 ApiErrorLogMapper 的日志级别为 info，避免和 GlobalExceptionHandler 重复打印
    cn.zszj.module.infra.dal.mysql.job.JobLogMapper: INFO # 配置 JobLogMapper 的日志级别为 info
    cn.zszj.module.infra.dal.mysql.file.FileConfigMapper: INFO # 配置 FileConfigMapper 的日志级别为 info
    cn.zszj.module.system.dal.mysql: debug
    cn.zszj.module.system.dal.mysql.sms.SmsChannelMapper: INFO # 配置 SmsChannelMapper 的日志级别为 info
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR # TODO 芋艿：先禁用，Spring Boot 3.X 存在部分错误的 WARN 提示

debug: false

--- #################### 微信公众号、小程序相关配置 ####################
wx:
  mp: # 公众号配置（必填），参见 https://github.com/Wechat-Group/WxJava/blob/develop/spring-boot-starters/wx-java-mp-spring-boot-starter/README.md 文档
#    app-id: "${ZSZJ_APPLICATION_DEV_WX_MP_APP_ID:}" # 测试号（牛希尧提供的）
#    secret: REDACTED_SOURCE_SECRET
#    app-id: wx5b23ba7a5589ecbb # 测试号（自己的）
#    secret: [已移除上游演示凭据]
    app-id: "${ZSZJ_APPLICATION_LOCAL_WX_MP_APP_ID:}" # 按环境注入，不使用上游测试号
    secret: "${ZSZJ_APPLICATION_LOCAL_WX_MP_SECRET:}" # source demo secret removed; configure explicitly
    # 存储配置，解决 AccessToken 的跨节点的共享
    config-storage:
      type: RedisTemplate # 采用 RedisTemplate 操作 Redis，会自动从 Spring 中获取
      key-prefix: wx # Redis Key 的前缀
      http-client-type: HttpComponents # 采用 HttpComponents（HttpClient 5）请求微信公众号平台
  miniapp: # 小程序配置（必填），参见 https://github.com/Wechat-Group/WxJava/blob/develop/spring-boot-starters/wx-java-miniapp-spring-boot-starter/README.md 文档
    #    appid: wx62056c0d5e8db250 # 测试号（牛希尧提供的）
    #    secret: [已移除上游演示凭据]
#    appid: "${ZSZJ_APPLICATION_DEV_WX_MINIAPP_APPID:}" # wenhualian的接口测试号
#    secret: REDACTED_SOURCE_SECRET
    appid: "${ZSZJ_APPLICATION_LOCAL_WX_MINIAPP_APPID:}" # 按环境注入，不使用上游测试号
    secret: "${ZSZJ_APPLICATION_LOCAL_WX_MINIAPP_SECRET:}" # source demo secret removed; configure explicitly
#    appid: wx66186af0759f47c9 # 测试号（puhui 提供的）
#    secret: [已移除上游演示凭据]
    config-storage:
      type: RedisTemplate # 采用 RedisTemplate 操作 Redis，会自动从 Spring 中获取
      key-prefix: wa # Redis Key 的前缀
      http-client-type: HttpComponents # 采用 HttpComponents（HttpClient 5）请求微信小程序平台

--- #################### 众墅之家相关配置 ####################

# 众墅之家配置项，设置当前项目所有自定义的配置
zszj:
  captcha:
    enable: false # 本地环境，暂时关闭图片验证码，方便登录等接口的测试；
  security:
    mock-enable: ${ZSZJ_APPLICATION_LOCAL_SECURITY_MOCK_ENABLE:false} # 默认禁用模拟认证（ZS-ENG-004）；如需本地调试，经环境变量显式开启
  pay:
    order-notify-url: ${ZSZJ_APPLICATION_LOCAL_PAY_ORDER_NOTIFY_URL:} # 支付渠道的【支付】回调地址
    refund-notify-url: ${ZSZJ_APPLICATION_LOCAL_PAY_REFUND_NOTIFY_URL:} # 支付渠道的【退款】回调地址
    transfer-notify-url: ${ZSZJ_APPLICATION_LOCAL_PAY_TRANSFER_NOTIFY_URL:} # 支付渠道的【转账】回调地址
  access-log: # 访问日志的配置项
    enable: false
  demo: false # 关闭演示模式
  wxa-code:
    env-version: develop # 小程序版本: 正式版为 "release"；体验版为 "trial"；开发版为 "develop"
  wxa-subscribe-message:
    miniprogram-state: developer # 跳转小程序类型：开发版为 “developer”；体验版为 “trial”为；正式版为 “formal”
  tencent-lbs-key: "${ZSZJ_APPLICATION_LOCAL_TENCENT_LBS_KEY:}" # source demo secret removed; configure explicitly

justauth:
  enabled: true
  type:
    DINGTALK: # 钉钉
      client-id: "${ZSZJ_APPLICATION_LOCAL_JUSTAUTH_TYPE_DINGTALK_CLIENT_ID:}"
      client-secret: "${ZSZJ_APPLICATION_LOCAL_JUSTAUTH_TYPE_DINGTALK_CLIENT_SECRET:}" # source demo secret removed; configure explicitly
      ignore-check-redirect-uri: true
    WECHAT_ENTERPRISE: # 企业微信
      client-id: "${ZSZJ_APPLICATION_LOCAL_JUSTAUTH_TYPE_WECHAT_ENTERPRISE_CLIENT_ID:}"
      client-secret: "${ZSZJ_APPLICATION_LOCAL_JUSTAUTH_TYPE_WECHAT_ENTERPRISE_CLIENT_SECRET:}" # source demo secret removed; configure explicitly
      agent-id: 1000004
      ignore-check-redirect-uri: true
    # noinspection SpringBootApplicationYaml
    WECHAT_MINI_PROGRAM: # 微信小程序
      client-id: ${wx.miniapp.appid}
      client-secret: ${wx.miniapp.secret}
      ignore-check-redirect-uri: true
      ignore-check-state: true # 微信小程序，不会使用到 state，所以不进行校验
    WECHAT_MP: # 微信公众号
      client-id: ${wx.mp.app-id}
      client-secret: ${wx.mp.secret}
      ignore-check-redirect-uri: true
    ALIPAY: # 支付宝小程序
      client-id: xx
      client-secret: "${ZSZJ_APPLICATION_LOCAL_JUSTAUTH_TYPE_ALIPAY_CLIENT_SECRET:}" # source demo secret removed; configure explicitly
      alipay-public-key: xx
      ignore-check-redirect-uri: true
      ignore-check-state: true
  cache:
    type: REDIS
    prefix: 'social_auth_state:' # 缓存前缀，目前只对 Redis 缓存生效，默认 JUSTAUTH::STATE::
    timeout: 24h # 超时时长，目前只对 Redis 缓存生效，默认 3 分钟

--- #################### 接口文档（ZS-ENG-005：仅本地开发开启） ####################

springdoc:
  api-docs:
    enabled: true # 本地开发开启；基础配置默认关闭，部署环境不暴露接口文档
  swagger-ui:
    enabled: true
