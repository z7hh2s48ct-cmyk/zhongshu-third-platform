--- #################### 众墅之家相关配置 ####################

zszj:
  info:
    version: 1.0.0
    base-package: cn.zszj
  web:
    admin-ui:
      url: http://dashboard.zszj.local # Admin 管理后台 UI 的地址
    cors: # ZS-SEC-004：跨域收紧为精确白名单，禁止裸 * 与凭据并存；生产/预发的真实前端域名在环境验收时按 env 覆盖
      allowed-origin-patterns:
        - "http://localhost:*"
        - "http://127.0.0.1:*"
        - "http://localhost" # ZS-SEC-004 P1-1：":*" 不匹配无端口源；本地 VITE_PORT=80 时 Origin 为无端口 http://localhost
        - "http://127.0.0.1"
      allow-credentials: true
      frame-options: SAMEORIGIN # 默认防点击劫持；确需被 iframe 嵌入时显式改为 DISABLE
  xss:
    enable: false
    exclude-urls: # 如下两个 url，仅仅是为了演示，去掉配置也没关系
      - ${spring.boot.admin.context-path}/** # 不处理 Spring Boot Admin 的请求
      - ${management.endpoints.web.base-path}/** # 不处理 Actuator 的请求
  security:
    permit-all_urls:
      - /admin-api/mp/open/** # 微信公众号开放平台，微信回调接口，不需要登录
    # ZS-LOGIN-001 令牌用途分离门控：代码默认 false（安全默认，getAccessToken 只认访问令牌）。
    # 现网置 true 的原因：admin-web IM、miniapp IM/客服的 WebSocket 握手以 ?token=<refreshToken> 作凭据
    # （浏览器 WS 无法自定义 Header，只能拼 URL 参数），依赖刷新令牌回退放行。此为迁移期临时兼容，
    # 须在 LOGIN-001.B（短时握手票据 + 前端 WS 迁移）完成后改回 false 并删除本键。
    refresh-token-as-access-token-enabled: true
    # ZS-SEC-011.B 持久化幂等摘要 pepper（keyed SHA-256 密钥，codex r1 P2-C 部署期注入，不硬编码）：
    # ① 须 ≥32 字符；配置了但长度不足 → 应用启动即失败（fail-fast，明确配置错误不允许带病启动）；
    # ② 未配置（空）→ 持久化幂等模式（persistent=true）拒绝启用（请求 fail-closed + 启动 WARN 留痕），
    #    Redis 窗口幂等模式不受影响（其摘要回退 .A 脱敏口径，有损边界已在代码/文档登记）；
    # ③ pepper 轮换会使存量持久化摘要失效（重放按冲突拒绝、客户端可重试）——轮换须与业务低峰/恢复处置协同。
    idempotent:
      digest:
        secret: "${ZSZJ_SECURITY_IDEMPOTENT_DIGEST_SECRET:}" # 部署期注入（≥32 字符），缺失不静默降级
  api-encrypt:
    enable: false # 是否开启 API 加密。默认关闭，避免低版本 JDK 8（8u120 以下）启动时 bcprov 的 JCE 认证报错
    algorithm: AES # 加密算法，支持 AES、RSA 等
    request-key: "${ZSZJ_REQUEST_KEY:}" # configure explicitly
    response-key: "${ZSZJ_RESPONSE_KEY:}" # configure explicitly
  websocket:
    enable: true # websocket的开关
    path: /infra/ws # 路径
    sender-type: local # 消息发送的类型，可选值为 local、redis、rocketmq、kafka、rabbitmq
    sender-rocketmq:
      topic: ${spring.application.name}-websocket # 消息发送的 RocketMQ Topic
      consumer-group: ${spring.application.name}-websocket-consumer # 消息发送的 RocketMQ Consumer Group
    sender-rabbitmq:
      exchange: ${spring.application.name}-websocket-exchange # 消息发送的 RabbitMQ Exchange
      queue: ${spring.application.name}-websocket-queue # 消息发送的 RabbitMQ Queue
    sender-kafka:
      topic: ${spring.application.name}-websocket # 消息发送的 Kafka Topic
      consumer-group: ${spring.application.name}-websocket-consumer # 消息发送的 Kafka Consumer Group
  swagger:
    title: 众墅之家 AI 赋能平台
    description: 提供管理后台、用户 App 的所有功能
    version: ${zszj.info.version}
    url: ${zszj.web.admin-ui.url}
    email: xingyu4j@vip.qq.com
    license: MIT
    license-url: https://gitee.com/zhijiantianya/ruoyi-vue-pro/blob/master/LICENSE
  codegen:
    base-package: ${zszj.info.base-package}
    db-schemas: ${spring.datasource.dynamic.datasource.master.name}
    front-type: 20 # 前端模版的类型，参见 CodegenFrontTypeEnum 枚举类
    vo-type: 10 # VO 的类型，参见 CodegenVOTypeEnum 枚举类
    delete-batch-enable: true # 是否生成批量删除接口
    unit-test-enable: false # 是否生成单元测试
    import-enable: false # 是否生成 Excel 导入接口
  job: # ZS-JOB-001：定时任务相关配置项
    # JobHandler 白名单，元素为 Spring Bean 名字（即 infra_job.handler_name）。
    # 空列表 = 未启用白名单管控（放行全部 Handler），用于尚未固化清单的环境批次，避免升级即中断既有任务；
    # 非空 = 已启用，只有清单内的 Handler 才允许被登记（创建/修改）与执行，其余一律拒绝。
    # 生产环境应显式固化清单；具体启用清单归环境批次（application-{env}.yaml），本地/单元测试经 @TestPropertySource 显式注入。
    handler-whitelist: []
  tenant: # 多租户相关配置项
    enable: true
    ignore-urls:
      - /jmreport/* # 积木报表，无法携带租户编号
      # ZS-FILE-001.A：文件下载（含匿名 PUBLIC 素材，浏览器 img/src 不携带 tenant-id 头）；
      # PRIVATE 的登录+同租户校验在 FileService#validateFileReadable 以 LoginUser 执行
      - /admin-api/infra/file/*/get/**
    ignore-visit-urls:
      - /admin-api/system/user/profile/**
      - /admin-api/system/auth/**
    ignore-tables:
    ignore-caches:
      - user_role_ids
      - permission_menu_ids
      - oauth_client
      - notify_template
      - mail_account
      - mail_template
      - sms_template
      - iot:device
      - iot:thing_model_list
  sms-code: # 短信验证码相关的配置项
    expire-times: 10m
    send-frequency: 1m
    send-maximum-quantity-per-day: 10
    begin-code: ${ZSZJ_SMS_CODE_BEGIN:1000} # ZS-LOGIN-004：环境变量占位 + 安全默认随机下界；固定演示码 9999 只允许出现在非生产 profile
    end-code: ${ZSZJ_SMS_CODE_END:9999} # ZS-LOGIN-004：环境变量占位 + 安全默认随机上界
  trade:
    order:
      pay-expire-time: 2h # 支付的过期时间
      receive-expire-time: 14d # 收货的过期时间
      comment-expire-time: 7d # 评论的过期时间
      status-sync-to-wxa-enable: true # 是否同步订单状态到微信小程序
    express:
      client: kd_100
      kd-niao:
        api-key: "${ZSZJ_APPLICATION_TRADE_EXPRESS_KD_NIAO_API_KEY:}" # source demo secret removed; configure explicitly
        business-id: 1809751
        request-type: 1002 # 免费版 1002；付费版 8001
      kd100:
        key: "${ZSZJ_SOURCE_EXAMPLE_KEY:}" # configure explicitly
        customer: "${ZSZJ_APPLICATION_KD100_CUSTOMER:}" # 按环境注入，不使用上游演示客户号
  iot:
    message-bus:
      type: redis # 消息总线的类型

debug: false

--- #################### Outbox 恢复台账与健康监测阈值（ZS-JOB-004） ####################

# 阈值为「保守占位」，待 WP-19 运行监控阶段实测回填（验收④：告警阈值经实测回填而非凭空声称容量达标）。
# 下列默认值仅保证「监测逻辑可运行 + 越阈可告警」，禁止被解读为生产容量/TPS 承诺（开发计划铁律 8）。
# 与 OutboxHealthProperties（@ConfigurationProperties "infra.outbox.health"）字段一一对应；某项缺省时以代码默认值生效。
infra:
  outbox:
    health:
      backlog-warn: 1000 # PENDING 积压预警阈值（占位，待实测回填）
      backlog-critical: 5000 # PENDING 积压严重阈值（占位，待实测回填）
      longest-wait-warn-seconds: 3600 # 最长等待预警阈值（秒，占位，待实测回填）
      failure-rate-warn-percent: 5 # 失败率预警阈值（百分比，占位，待实测回填）
      lease-stale-seconds: 0 # 租约过期宽限（秒）：0 = 已过期即视为 dispatcher 停摆
      max-manual-retry: 3 # 单事件人工重试上限（无限重试护栏，超过即拒绝）

--- #################### 管理端点（ZS-ENG-005：默认仅健康检查） ####################

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health

--- #################### 数据库迁移（ZS-DB-003 / PEND-005） ####################

spring:
  flyway:
    enabled: false # V1 基线由 ZS-DB-004 交付，部署环境经 ZSZJ_FLYWAY_ENABLED 激活
    locations: classpath:db/migration # 唯一迁移目录（规范见 docs/数据库迁移规范.md）
    out-of-order: false # 全局版本顺序，多实例走兼容迁移+滚动发布
    validate-on-migrate: true # 已执行脚本被篡改（校验和失配）即阻止启动
    clean-disabled: true # 全环境禁用 clean；测试库清理由 ZS-DB-019 临时实例负责
    baseline-on-migrate: true # 既有旧库首次接入时吸收为基线，不重放 V1
    baseline-version: 20260909.001 # 与 V1 基线迁移版本一致：既有旧库吸收后不重放 V1，新空库正常执行 V1
