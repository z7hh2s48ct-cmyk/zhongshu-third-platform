# ZS-OPS-002.A 反向代理配置——TLS 终结 + 管理路径关闭
# 前置：ZS-ENG-005（actuator 收紧，exposure.include: health）
#
# 边界：
#   1. /actuator/* 和 /admin/* 必须在此处关闭（deny all）
#   2. 不得将内部管理端口（postgres/redis）暴露到公网
#   3. TLS 证书通过 volume mount 注入，禁止硬编码私钥内容
#   4. upstream 端口固定 48080（与 ZSZJ_SERVER_PORT 默认值一致）；
#      如修改 ZSZJ_SERVER_PORT 须同步更新本文件 proxy_pass 端口

# ---- HTTP → HTTPS 重定向（按需启用）----
# server {
#     listen 80;
#     server_name _;
#     # Let's Encrypt HTTP-01 验证路径（申请证书时临时启用）
#     location /.well-known/acme-challenge/ { root /var/www/certbot; }
#     location / { return 301 https://$host$request_uri; }
# }

# ---- HTTPS 主站 ----
server {
    listen 443 ssl http2;
    server_name _;

    # TLS 证书（由 volume mount 从宿主机注入，路径见 .env.example）
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---- 敏感管理路径关闭（ZS-ENG-005 + ZS-OPS-002.A）----
    # actuator 端点：ZS-ENG-005 已将 exposure.include 收紧为 health，
    # 但即便 health 端点也不应对外暴露（仅供容器内 healthcheck 调用）
    location /actuator/ {
        deny all;
        return 403;
    }

    # admin 管理后台路径：内部运维专用，不对外
    location /admin/ {
        deny all;
        return 403;
    }

    # ---- nginx 自身健康检查（compose healthcheck 调用）----
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---- WebSocket 端点（/infra/ws）----
    # 后端启用 WebSocket；nginx 默认 HTTP/1.0 不转发 Upgrade 头，须显式配置
    location /infra/ws {
        proxy_pass http://zszj-server:48080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # WebSocket 长连接超时
        proxy_send_timeout 3600s;
    }

    # ---- 业务流量反向代理 ----
    location / {
        proxy_pass http://zszj-server:48080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # 禁止代理访问内部管理端口
        # postgres:5432 / redis:6379 仅在 zszj-internal 网络内可达，此处不转发
    }

    # ---- 客户端请求体限制（防大文件攻击）----
    client_max_body_size 50m;
}
