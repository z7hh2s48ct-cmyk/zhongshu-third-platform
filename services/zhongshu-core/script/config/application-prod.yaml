# =====================================================================
# 众墅之家部署环境模板（ZS-ENG-003 / docs/06 映射 #7；合同见同目录 README.md）
#
# 用法：复制到部署机 zszj-server.jar 同级 config/application-prod.yaml，
#       并注入 ZSZJ_* 环境变量。全部凭据经环境变量注入，禁止写真实值入库。
# 必填项使用无默认值占位符：漏配时启动报 "Could not resolve placeholder"
# （脱敏错误，只含变量名），不静默回退演示服务。
# =====================================================================

server:
  port: ${ZSZJ_SERVER_PORT:48080}

--- #################### 数据库（D-08：仅 PostgreSQL） ####################

spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: ${ZSZJ_DATASOURCE_URL} # 必填，jdbc:postgresql://host:5432/<database>
          username: ${ZSZJ_DATASOURCE_USERNAME} # 必填，应用低权限账号（迁移账号分离归 ZS-DB-002）
          password: ${ZSZJ_DATASOURCE_PASSWORD} # 必填
        druid:
          validation-query: ${ZSZJ_DATASOURCE_VALIDATION_QUERY:SELECT 1} # PG 方言默认 SELECT 1

--- #################### Redis ####################

  data:
    redis:
      host: ${ZSZJ_REDIS_HOST} # 必填
      port: ${ZSZJ_REDIS_PORT:6379}
      password: ${ZSZJ_REDIS_PASSWORD} # 必填（生产必须启用 Redis 密码）

--- #################### 监控（ZS-ENG-005 收紧后的部署默认值） ####################

management:
  endpoints:
    web:
      exposure:
        include: health # 生产仅暴露健康检查；详情类端点按 ZS-ENG-005 白名单另行评估

# Spring Boot Admin 客户端默认关闭；如需启用另行评估账号与网络边界
spring.boot.admin.client.enabled: false

--- #################### 安全（ZS-ENG-004） ####################

zszj:
  security:
    mock-enable: false # 部署环境显式禁用模拟认证旁路（框架默认即为 false，此处显式声明防误配）
    # ZS-LOGIN-004：登录方式门控——一期只获准「账号密码」，其余入口默认关闭，须经环境变量显式开启
    login-mode:
      sms-enabled: ${ZSZJ_LOGIN_MODE_SMS_ENABLED:false}
      social-enabled: ${ZSZJ_LOGIN_MODE_SOCIAL_ENABLED:false}
      register-enabled: ${ZSZJ_LOGIN_MODE_REGISTER_ENABLED:false}
      reset-password-enabled: ${ZSZJ_LOGIN_MODE_RESET_PASSWORD_ENABLED:false}
  # ZS-LOGIN-004：验证码取值域与安全参数——生产必须为足够大的随机区间，严禁固定演示码 9999
  sms-code:
    begin-code: ${ZSZJ_SMS_CODE_BEGIN:1000}
    end-code: ${ZSZJ_SMS_CODE_END:9999}
    max-validate-attempts: ${ZSZJ_SMS_MAX_VALIDATE_ATTEMPTS:5}
    attempt-lock-duration: ${ZSZJ_SMS_ATTEMPT_LOCK_DURATION:10m}
    send-maximum-quantity-per-ip-per-hour: ${ZSZJ_SMS_SEND_MAX_PER_IP_HOUR:20}
    send-maximum-quantity-per-ip-per-day: ${ZSZJ_SMS_SEND_MAX_PER_IP_DAY:50}

--- #################### 定时任务（ZS-ENG-006 边界） ####################

spring:
  quartz:
    auto-startup: ${ZSZJ_QUARTZ_AUTO_STARTUP:false} # 部署默认不随应用启动调度器，启用须过 ZS-ENG-006 盘点

--- #################### 数据库迁移（ZS-DB-003） ####################

spring:
  flyway:
    enabled: ${ZSZJ_FLYWAY_ENABLED:false} # 基线迁移落地（ZS-DB-004）后经环境变量激活
    # 迁移连接默认回落应用数据源；需要 DDL 专用迁移账号时显式注入：
    # url: ${ZSZJ_FLYWAY_URL}
    # user: ${ZSZJ_FLYWAY_USER}
    # password: ${ZSZJ_FLYWAY_PASSWORD}
