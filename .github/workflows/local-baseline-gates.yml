name: local-baseline-gates

# ZS-OPS-001.A：基础构建/文档流水线骨架——与本地 `node scripts/ops/run-local-gates.mjs` 同一规则。
# fast job 仅静态/单测门禁；PG 层入 pg-regression.yml（ZS-OPS-001.B）；安全/基础管理 API 层入
# security-chain-regression + sys001-regression job（ZS-OPS-001.C，G12/G14 同规则）；多端 E2E（.D）按批次接入；
# 流程（.E）= pg-regression.yml 通道（bpm001 #9 + bpm003 #21 套件，ZS-OPS-001.E 同入口覆盖）。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  baseline-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 运行基线门禁（--fast：跳过需前端依赖的类型检查，其由 ZS-CLIENT-005.A 本地门禁覆盖）
        run: node scripts/ops/run-local-gates.mjs --fast

  # ZS-SEC-012.B：安全链联合回归入 CI（与本地 G12 同一入口/同一用例集）。
  # ubuntu-latest 由 setup-java 提供 JDK17 + 自带 mvn，无需 tools/env.sh（Windows 自引导工具链仅本地）。
  security-chain-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 运行安全链联合回归（.A 31 + .B 9 + visit 夹具，未授权/失败不伪报成功）
        working-directory: services/zhongshu-core
        run: >-
          mvn -pl zszj-framework/zszj-spring-boot-starter-web,zszj-framework/zszj-spring-boot-starter-biz-tenant -am
          -Dtest=SecurityFilterChainFixtureTest,CrossTenantVisitEnabledFixtureTest,SecurityChainJointRegressionTest,SecurityChainEmbeddedCorsTest,ApiAccessLogFilterAsyncTest
          -Dsurefire.failIfNoSpecifiedTests=false test

  # ZS-OPS-001.C：基础管理 API 层回归入 CI（与本地 G14 同一入口/同一用例集）。
  # 一次性 Docker PG17+Redis 夹具（ubuntu-latest 自带 Docker），真实 server 进程 + 50 用例矩阵；
  # 缺 Docker/夹具失败退出非零，不静默回退（ZS-SYS-001.A 同入口）。
  sys001-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 运行基础管理 API 层回归（七类矩阵，越权/基础功能失败阻止合入）
        run: node scripts/sys001/run-sys001-regression.mjs
